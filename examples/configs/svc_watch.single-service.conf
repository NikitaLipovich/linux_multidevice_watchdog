{
  "schema": 2,

  "framework": {
    "transport": {
      "type": "unix_datagram",
      "unix_datagram": { "socket": "/var/run/svc_wd.sock", "format": "text_v1" }
    },
    "observer": {
      "enabled": true,
      "mode": "act",
      "tick_ms": 1000,
      "pause_file": "/tmp/wd_pause",
      "oom_adj": -1000,
      "log": { "file": "/mnt/sda1/crash_logs/wd.log", "rotate_kb": 1024, "keep": 7, "fsync": true },
      "quiet": { "paused_ms": 60000, "unknown_ms": 60000 }
    },
    "gates": { "min_free_mb": 8, "max_load1": 3.0, "recheck_ms": 5000, "force_after_ms": 300000, "alarm_mb": 5 },
    "pacing": { "type": "fixed", "delay_ms": 5000 }
  },

  "actions": {
    "recreate": {
      "type": "request_file",
      "file": "/tmp/svc_crash_{service}",
      "eat_within_ms": 10000,
      "startup_ms": 60000,
      "rate_limit": { "max": 6, "per_ms": 600000, "on_exceeded": "cooldown", "cooldown_ms": 300000 }
    }
  },

  "ladders": {
    "escalate_std": [ { "do": "@recreate", "tries": 3 }, { "do": "restart_process" } ],
    "process_only": [ { "do": "restart_process" } ]
  },

  "processes": {
    "unified": {
      "launch": {
        "type": "init_script",
        "script": "/etc/init.d/rut_services",
        "pidfile": "/tmp/rut_services.pid",
        "grace": { "type": "fixed", "ms": 90000 },
        "restart_rate_limit": { "max": 5, "per_ms": 600000, "on_exceeded": "cooldown", "cooldown_ms": 300000 }
      },
      "supervisor": {
        "poll_ms": 1000,
        "stop_timeout_ms": 20000,
        "min_stable_ms": 5000,
        "max_consecutive_start_failures": 5,
        "backoff": { "start_ms": 1000, "factor": 2, "cap_ms": 10000 },
        "log": {
          "file": "/mnt/sda1/crash_logs/unified.log",
          "rotate_kb": 1024,
          "keep": 7,
          "fallbacks": ["/usr/local/home/root/logs/processes/services_runtime.log", "/tmp/services_runtime.log"]
        }
      },
      "watch": {
        "P2_request_stuck": { "mode": "act", "ladder": "@process_only" }
      },

      "services": {

        "config_server": {
          "start": { "type": "python", "entry": "run_services:start_config_server" },
          "port": 8000,
          "signals": {
            "pulse": {
              "from": "probe",
              "every_ms": 5000,
              "probe": { "type": "tcp", "port": "@port", "timeout_ms": 2000 }
            },
            "activity": { "tick_ms": 2000 }
          },
          "watch": {
            "L1_pulse_lost":      { "mode": "act", "dead_after_ms": 30000, "ladder": "@escalate_std" },
            "L2_activity_frozen": { "mode": "act", "frozen_after_ms": 60000, "ladder": "@escalate_std" }
          }
        }
      }
    }
  }
}
