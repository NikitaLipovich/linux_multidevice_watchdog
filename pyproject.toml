[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "svc-watch"
version = "0.1.0"
description = "Config-driven service supervisor + watchdog: a Python embedding library plus a small C observer, both driven by one declarative config."
readme = "README.md"
# FR-71: core stays 3.9-compatible (no 3.11 asyncio.TaskGroup). Do not raise without re-checking core.
requires-python = ">=3.9"
license = { text = "TBD" }

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
